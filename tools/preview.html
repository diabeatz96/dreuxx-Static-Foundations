<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Revisión de tamaños — RNA en 3D</title>
    <style>
      body { margin: 20px; background: #ddd; color: #222; font: 16px Arial, sans-serif; }
      h1 { font-size: 20px; }
      .controls { display: flex; flex-wrap: wrap; gap: 16px; align-items: center; margin: 20px 0; }
      button, select { min-height: 40px; font: inherit; }
      iframe { display: block; height: 820px; border: 0; background: #fff; }
      pre { white-space: pre-wrap; }
    </style>
  </head>
  <body>
    <h1>Revisión de tamaños</h1>
    <p>La página se carga dentro de un marco con el ancho seleccionado.</p>
    <div class="controls">
      <label for="width">Ancho</label>
      <select id="width">
        <option value="375">375 px</option>
        <option value="768">768 px</option>
        <option value="1280" selected>1280 px</option>
      </select>
      <button id="measure" type="button">Medir desbordamiento</button>
      <button id="full-height" type="button">Mostrar página completa</button>
      <label><input id="no-js" type="checkbox" /> Desactivar JavaScript</label>
    </div>
    <pre id="result" role="status">Elige un ancho y pulsa Medir desbordamiento.</pre>
    <iframe id="preview" title="Página de RNA" src="../index.html" width="1280"></iframe>
    <script>
      const frame = document.querySelector('#preview');
      const result = document.querySelector('#result');
      document.querySelector('#width').addEventListener('change', (event) => {
        frame.width = event.target.value;
        frame.style.height = '820px';
        result.textContent = 'Ancho cambiado. Vuelve a medir.';
      });
      document.querySelector('#measure').addEventListener('click', () => {
        try {
          const root = frame.contentDocument.documentElement;
          result.textContent = JSON.stringify({
            viewport: root.clientWidth,
            contenido: root.scrollWidth,
            desbordamiento: root.scrollWidth > root.clientWidth
          }, null, 2);
        } catch {
          result.textContent = 'Abre esta herramienta mediante un servidor o en Netlify para medir.';
        }
      });
      document.querySelector('#full-height').addEventListener('click', () => {
        try {
          frame.style.height = frame.contentDocument.documentElement.scrollHeight + 'px';
        } catch {
          result.textContent = 'Abre esta herramienta mediante un servidor o en Netlify.';
        }
      });
      document.querySelector('#no-js').addEventListener('change', (event) => {
        if (event.target.checked) frame.setAttribute('sandbox', 'allow-same-origin');
        else frame.removeAttribute('sandbox');
        frame.src = '../index.html?preview=' + (event.target.checked ? 'sin-js' : 'con-js');
      });
    </script>
  </body>
</html>
